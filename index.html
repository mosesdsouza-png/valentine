<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #ffe6eb;
      overflow: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 40px;
      text-align: center;
    }

    /* Container for buttons side by side */
    .buttons {
      display: flex;
      gap: 40px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* YES button */
    #yes {
      padding: 20px 45px;
      font-size: 22px;
      font-weight: bold;
      background-color: #ff4d6d;
      color: white;
    }

    /* NO button */
    #no {
      width: 70px;
      height: 35px;
      font-size: 13px;
      background-color: #999;
      color: white;
      border-radius: 10px;
      /* Initially static inside the flex container */
      position: relative;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine Kamakshu?❤️😉🦦 </h1>

  <div class="buttons">
    <button id="yes" onclick="goYes()">YES</button>
    <button id="no">no</button>
  </div>

  <script>
    const noButton = document.getElementById("no");
    let isMoving = false; // flag to start moving only after first hover/touch

    // Start moving on hover or touch
    noButton.addEventListener("mouseenter", startMoving);
    noButton.addEventListener("touchstart", startMoving);

    function startMoving() {
      if (!isMoving) {
        isMoving = true;
        // Set position to fixed once it starts moving
        noButton.style.position = "fixed";
        moveNo(); // first move
      }
    }

    function moveNo() {
      const padding = 20;

      const maxX = window.innerWidth - noButton.offsetWidth - padding;
      const maxY = window.innerHeight - noButton.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    // Keep moving while hovering
    noButton.addEventListener("mouseenter", () => {
      if (isMoving) moveNo();
    });
    noButton.addEventListener("touchstart", () => {
      if (isMoving) moveNo();
    });

    function goYes() {
      window.location.href = "yes.html";
    }
  </script>

</body>
</html>
