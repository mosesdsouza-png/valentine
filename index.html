<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #ffe6eb;
      overflow: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 40px;
    }

    /* Container ONLY for initial alignment */
    .buttons {
      display: flex;
      gap: 40px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* YES button */
    #yes {
      padding: 20px 45px;
      font-size: 22px;
      font-weight: bold;
      background-color: #ff4d6d;
      color: white;
    }

    /* NO button — FIXED SIZE */
    #no {
      width: 70px;
      height: 35px;
      font-size: 13px;
      background-color: #999;
      color: white;

      /* KEY PART */
      position: fixed;          /* relative to entire screen */
      border-radius: 10px;      /* locked shape */
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? 💖</h1>

  <div class="buttons">
    <button id="yes" onclick="goYes()">YES</button>
    <button id="no">no</button>
  </div>

  <script>
    const noButton = document.getElementById("no");

    // Move on hover (desktop) or touch (mobile)
    noButton.addEventListener("mouseenter", moveNo);
    noButton.addEventListener("touchstart", moveNo);

    function moveNo() {
      const padding = 20;

      const maxX = window.innerWidth - noButton.offsetWidth - padding;
      const maxY = window.innerHeight - noButton.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    function goYes() {
      window.location.href = "yes.html";
    }
  </script>

</body>
</html>
