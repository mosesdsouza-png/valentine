<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #ffe6eb;
      overflow: hidden;
    }

    /* Top image */
    #topImage {
      width: 200px;      /* adjust as needed */
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 40px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      padding: 20px 45px;
      font-size: 22px;
      font-weight: bold;
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      width: 70px;
      height: 35px;
      font-size: 13px;
      background-color: #999;
      color: white;
      border-radius: 10px;
      position: relative; /* starts static, moves on hover/touch */
    }

    #note {
      margin-top: 25px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>

  <!-- Top image -->
  <img id="topImage" src="me.jpg" alt="Cute image">

  <!-- Question -->
  <h1>Will you be my Valentine kamakshu? 🦦😉❤️ </h1>

  <!-- Buttons -->
  <div class="buttons">
    <button id="yes" onclick="goYes()">YES</button>
    <button id="no">no</button>
  </div>




  
  <!-- Note below buttons -->
  <div id="note">No seems a bit shy 😏</div>

  <script>
    const noButton = document.getElementById("no");
    let isMoving = false; // starts moving only after first hover/touch

    // Start moving on hover or touch
    noButton.addEventListener("mouseenter", startMoving);
    noButton.addEventListener("touchstart", startMoving);

    function startMoving() {
      if (!isMoving) {
        isMoving = true;
        noButton.style.position = "fixed"; // free to move anywhere
        moveNo(); // first move
      }
    }

    function moveNo() {
      const padding = 20;
      const maxX = window.innerWidth - noButton.offsetWidth - padding;
      const maxY = window.innerHeight - noButton.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    // Keep moving on hover/touch after first movement
    noButton.addEventListener("mouseenter", () => { if(isMoving) moveNo(); });
    noButton.addEventListener("touchstart", () => { if(isMoving) moveNo(); });

    // YES button click
    function goYes() {
      window.location.href = "yes.html";
    }
  </script>

</body>
</html>
